# Disposable session storage: restarting Redis signs users out; it never stores business data.
# Use a managed HA Redis via REDIS_URL if uninterrupted sessions are required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tronicare-admin-sessions
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tronicare-admin-sessions
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tronicare-admin-sessions
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            exec:
              command: [redis-cli, ping]
          livenessProbe:
            exec:
              command: [redis-cli, ping]
---
apiVersion: v1
kind: Service
metadata:
  name: tronicare-admin-sessions
spec:
  selector:
    app.kubernetes.io/name: tronicare-admin-sessions
  ports:
    - port: 6379
      targetPort: redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tronicare-admin-sessions
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tronicare-admin-sessions
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tronicare-admin
      ports:
        - protocol: TCP
          port: 6379
