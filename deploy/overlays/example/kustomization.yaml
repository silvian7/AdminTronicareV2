apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tronicare-admin
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
configMapGenerator:
  - name: tronicare-admin-config
    behavior: merge
    literals:
      - PUBLIC_ORIGIN=https://admin.example.com
# Replace the image and immutable release tag with your registry's values.
images:
  - name: tronicare-admin
    newName: registry.example.com/tronicare/admin
    newTag: v0.1.0
